<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小刘的个人平台</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .navbar .logo {
            font-size: 22px;
            font-weight: bold;
            color: #58a6ff;
        }
        .navbar .logo span {
            color: #c9d1d9;
        }
        .nav-links a {
            color: #8b949e;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #58a6ff;
        }

        /* 中间主体区域 */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }
        .container .avatar {
            font-size: 70px;
            margin-bottom: 15px;
        }
        .container h1 {
            font-size: 36px;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .container .desc {
            font-size: 16px;
            color: #8b949e;
            max-width: 600px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* 标签卡片区域 */
        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            max-width: 600px;
        }
        .tag-item {
            background: #21262d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            border: 1px solid #30363d;
            display: inline-flex;
            align-items: center;
        }
        .tag-item i {
            margin-right: 6px;
        }

        /* 底部链接按钮 */
        .action-links {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .action-btn {
            background: #238636;
            color: #ffffff;
            padding: 10px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #2ea043;
        }
        .action-btn.outline {
            background: transparent;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .action-btn.outline:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }

        /* 底部版权 */
        .footer {
            text-align: center;
            padding: 25px 0;
            border-top: 1px solid #30363d;
            color: #8b949e;
            font-size: 14px;
            background-color: #0d1117;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="logo">🍀 小刘<span>.dev</span></div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/about">关于我</a>
            <a href="#">联系我们</a>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="container">
        <div class="avatar">🐟</div> <!-- 你要是想换回那个四叶草，把🐟换成🍀就行 -->
        <h1>小刘的个人平台</h1>
        <p class="desc">
            这是一个用 Python Flask 搭建的个人主页。<br>
            在这里可以存放个人文件，代码和小游戏还有音乐，<br>
            <span style="color: #da3633; font-weight: bold;">禁止存放涉黄等有关文件</span>
        </p>

        <!-- 标签云 -->
        <div class="tags-wrapper">
            <span class="tag-item">🎵 音乐 Music</span>
            <span class="tag-item">💻 计算机应用技术</span>
            <span class="tag-item">🪝 钓鱼网站分析</span>
            <span class="tag-item">🛡️ 网络安全维护</span>
        </div>

        <!-- 行动按钮 -->
        <div class="action-links">
            <a href="#" class="action-btn">GitHub</a>
            <a href="/about" class="action-btn outline">关于我</a>
            <a href="#" class="action-btn outline">联系我们</a>
        </div>
    </main>

    <!-- 底部版权 -->
    <footer class="footer">
        &copy; 2026 小刘的个人平台 | 赛博空间由大肥鱼提供算力支持
    </footer>
</body>
</html>
